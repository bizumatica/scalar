baseURL = 'https://scalar1.pages.dev/'
locale = 'pt-br'
title = 'Scalar | Ferramentas de Precisão'

[permalinks]
  ferramentas = '/:contentbasename/' 

[build]
  writeStats = true
  [build.buildStats]
    enableResourceIndices = true

[minify]
  disableHTML = false
  disableJS = false
  disableCSS = false
  minifyOutput = true
  
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  description = "Scalar: Ferramentas de Precisão para Engenharia e Computação."