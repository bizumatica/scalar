# ==============================================================================
# SCAL4R ARCHITECTURE CONFIGURATION - PRODUCTION 2026
# Otimizado para Alta Performance Hugo v0.160+ / v0.161+
# Opção B: Single Content Directory com Roteamento Dinâmico via Front Matter
# ==============================================================================

baseURL = 'https://scal4r.com/'
defaultContentLanguage = 'pt-br'

# Garante que o PT-BR fique na raiz (scal4r.com/) e as demais línguas nos subdiretórios (/en/, /de/, /ja/)
defaultContentLanguageInSubdir = false

# ELIMINAÇÃO DE TAXONOMIAS FANTASMAS (Sintaxe atualizada anti-Thin Content)
disableKinds = ["taxonomy"]

# ==============================================================================
# IDIOMAS & LOCALIZAÇÃO (Sincronização Atômica de Rotas Multilinguais)
# ==============================================================================

[languages]
  # --- PORTUGUÊS (RAIZ) ---
  [languages.pt-br]
    locale = 'pt-br'       
    label = 'Português'    
    contentDir = 'content' 
    weight = 1
    title = 'Scal4r | Ferramentas de Precisão'
    
    [languages.pt-br.params]
      description = "Scal4r: Ferramentas de Precisão para Engenharia e Computação."
    
    [languages.pt-br.permalinks]
      # Alinhado com o motor de slugs nativos do Hugo
      ferramentas = '/ferramentas/:slug/'

  # --- INGLÊS ---
  [languages.en]
    locale = 'en'          
    label = 'English'      
    contentDir = 'content' 
    weight = 2
    title = 'Scal4r | Precision Tools'
    
    [languages.en.params]
      description = "Scal4r: High-precision engineering and computing utility tools."
    
    [languages.en.permalinks]
      # Altera a seção raiz para /tools/ e lê a propriedade slug do index.en.md
      ferramentas = '/tools/:slug/'

  # --- ALEMÃO (TIER 1 DACH REGION) ---
  [languages.de]
    locale = 'de'          
    label = 'Deutsch'      
    contentDir = 'content' 
    weight = 3
    title = 'Scal4r | Präzisionswerkzeuge'
    
    [languages.de.params]
      description = "Scal4r: Hochpräzise Werkzeuge für Ingenieurwesen und Informatik."
    
    [languages.de.permalinks]
      # Altera a seção raiz para /werkzeuge/ e lê a propriedade slug do index.de.md
      ferramentas = '/werkzeuge/:slug/'

  # --- JAPONÊS (TIER 1 APAC REGION) ---
  [languages.ja]
    locale = 'ja'          
    label = '日本語'      
    contentDir = 'content' 
    weight = 4
    title = 'Scal4r | 精密ツール'
    
    [languages.ja.params]
      description = "Scal4r: 工学およびコンピューティング向けの精密ユーティリティツール。"
    
    [languages.ja.permalinks]
      # Mantém /tools/ para o mercado japonês, lendo a propriedade slug do index.ja.md
      ferramentas = '/tools/:slug/'

# ==============================================================================
# CONFIGURAÇÕES DE SISTEMA E DESEMPENHO LOCAL
# ==============================================================================

[params]
  adsense_id = "ca-pub-3733806324330520"

[build]
  writeStats = true
  [build.buildStats]
    enableResourceIndices = true

# MINIFICAÇÃO NATIVA (Processamento otimizado para poupar RAM durante o build)
[minify]
  disableHTML = false
  disableJS = false
  disableCSS = false
  minifyOutput = true

# CONFIGURAÇÃO DE RASTREABILIDADE (SEO Sênior)
[sitemap]
  changefreq = "weekly"
  priority = 0.8             
  filename = "sitemap.xml"

# ==============================================================================
# PIPELINE DE OUTPUTS & GERAÇÃO AUTOMÁTICA DO ADS.TXT
# ==============================================================================

# [outputs]
#  home = ["HTML", "RSS", "AdsTxt"]
#
# [outputFormats.AdsTxt]
  # baseName = "ads"
  # mediaType = "text/plain"
  # isPlainText = true
  # notAlternative = true

# CORE DE RENDERIZAÇÃO (Suporte a Math/LaTeX e Injeção Segura de Scripts)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true