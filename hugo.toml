# ==============================================================================
# SCAL4R ARCHITECTURE CONFIGURATION - PRODUCTION 2026
# Otimizado para Alta Performance Hugo v0.120+ / v0.160+
# Single Content Directory com Roteamento Dinâmico via Front Matter
# ==============================================================================

baseURL = 'https://scal4r.com/'
defaultContentLanguage = 'pt-br'

# Mantém PT-BR na raiz (scal4r.com/) e demais línguas em subdiretórios (/en/, /de/, /ja/, /es/, /fr/)
defaultContentLanguageInSubdir = false

# ELIMINAÇÃO DE TAXONOMIAS FANTASMAS (Evita Thin Content em SEO)
disableKinds = ["taxonomy", "term"]

# ==============================================================================
# IDIOMAS & LOCALIZAÇÃO (Sincronização Atômica de Rotas Multilinguais)
# ==============================================================================

[languages]
  # --- PORTUGUÊS (RAIZ) ---
  [languages.pt-br]
    locale = 'pt-br'
    label = 'Português'
    contentDir = 'content' 
    weight = 1
    title = 'Scal4r | Ferramentas de Precisão'
    
    [languages.pt-br.params]
      description = "Scal4r: Ferramentas de Precisão para Engenharia e Computação."
      isoCode = "pt-BR"

    [languages.pt-br.permalinks]
      ferramentas = '/ferramentas/:slug/'
      page = '/:slug/'

  # --- INGLÊS ---
  [languages.en]
    locale = 'en'
    label = 'English'
    contentDir = 'content' 
    weight = 2
    title = 'Scal4r | Precision Tools'
    
    [languages.en.params]
      description = "Scal4r: High-precision engineering and computing utility tools."
      isoCode = "en-US"

    [languages.en.permalinks]
      ferramentas = '/tools/:slug/'
      page = '/:slug/'

  # --- ALEMÃO (TIER 1 DACH REGION) ---
  [languages.de]
    locale = 'de'
    label = 'Deutsch'
    contentDir = 'content' 
    weight = 3
    title = 'Scal4r | Präzisionswerkzeuge'
    
    [languages.de.params]
      description = "Scal4r: Hochpräzise Werkzeuge für Ingenieurwesen und Informatik."
      isoCode = "de-DE"

    [languages.de.permalinks]
      ferramentas = '/werkzeuge/:slug/'
      page = '/:slug/'

  # --- JAPONÊS (TIER 1 APAC REGION) ---
  [languages.ja]
    locale = 'ja'
    label = '日本語'
    contentDir = 'content' 
    weight = 4
    title = 'Scal4r | 精密ツール'
    
    [languages.ja.params]
      description = "Scal4r: 工学およびコンピューティング向けの精密ユーティリティツール。"
      isoCode = "ja-JP"

    [languages.ja.permalinks]
      ferramentas = '/tools/:slug/'
      page = '/:slug/'

  # --- ESPANHOL (LATAM / ESPANHA) ---
  [languages.es]
    locale = 'es'
    label = 'Español'
    contentDir = 'content'
    weight = 5
    title = 'Scal4r | Herramientas de Precisión'

    [languages.es.params]
      description = "Scal4r: Herramientas de precisión para ingeniería y computación."
      isoCode = "es-ES"

    [languages.es.permalinks]
      ferramentas = '/herramientas/:slug/'
      page = '/:slug/'

  # --- FRANCÊS (EUROPA OCIDENTAL / CANADÁ) ---
  [languages.fr]
    locale = 'fr'
    label = 'Français'
    contentDir = 'content'
    weight = 6
    title = 'Scal4r | Outils de Précision'

    [languages.fr.params]
      description = "Scal4r: Outils de précision pour l'ingénierie et l'informatique."
      isoCode = "fr-FR"

    [languages.fr.permalinks]
      ferramentas = '/outils/:slug/'
      page = '/:slug/'

# ==============================================================================
# CONFIGURAÇÕES DE SISTEMA, ADSENSE E DESEMPENHO DE BUILD
# ==============================================================================

[params]
  adsense_id = "ca-pub-3733806324330520"

[build]
  writeStats = true
  noJSConfigInHTML = false
  [build.buildStats]
    enableResourceIndices = true

# MINIFICAÇÃO NATIVA
[minify]
  minifyOutput = true

# CONFIGURAÇÃO DE RASTREABILIDADE (SEO)
[sitemap]
  changefreq = "weekly"
  priority = 0.8             
  filename = "sitemap.xml"

# CORE DE RENDERIZAÇÃO (GOLDMARK PASSTHROUGH NATIVO PARA KATEX/LATEX)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]