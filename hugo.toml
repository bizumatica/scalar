baseURL = 'https://scal4r.com/' 
locale = 'pt-br'
title = 'Scalar | Ferramentas de Precisão'

[permalinks]
  ferramentas = '/:contentbasename/' 

[build]
  writeStats = true
  [build.buildStats]
    enableResourceIndices = true

[minify]
  disableHTML = false
  disableJS = false
  disableCSS = false
  minifyOutput = true
  
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  description = "Scalar: Ferramentas de Precisão para Engenharia e Computação."
  adsense_id = "ca-pub-3733806324330520" 

[outputs]
  home = ["HTML", "RSS", "AdsTxt"]

[outputFormats.AdsTxt]
  baseName = "ads"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true