{{ define "main" }}
<main class="w-full bg-zinc-950 text-zinc-100 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-3xl mx-auto">
    
    <article class="space-y-8">
      
      <header class="border-b border-zinc-900 pb-6">
        <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight mb-2">
          {{ .Title }}
        </h1>
        {{ with .Description }}
          <p class="text-zinc-500 text-sm font-mono tracking-tight">{{ . }}</p>
        {{ end }}
      </header>

      <section class="prose prose-invert max-w-none text-zinc-300 leading-relaxed
                      prose-headings:text-white prose-headings:font-bold prose-headings:tracking-tight
                      prose-h2:text-xl prose-h2:border-b prose-h2:border-zinc-900 prose-h2:pb-2 prose-h2:pt-4
                      prose-a:text-indigo-400 prose-a:no-underline hover:prose-a:underline
                      prose-strong:text-zinc-100 prose-code:text-emerald-400 prose-code:font-mono">
        {{ .Content }}
      </section>

    </article>
    
  </div>
</main>
{{ end }}
