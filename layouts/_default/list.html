{{ define "main" }}
<div class="container mx-auto px-4 py-8">
    <header class="mb-10">
        <h1 class="text-3xl font-extrabold text-white">{{ .Title }}</h1>
        <p class="text-slate-400 mt-2">Ferramentas disponíveis em: {{ .Title }}</p>
    </header>

    <div class="tools-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" style="text-decoration: none;">
            <article style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; background: rgba(30, 41, 59, 0.4); border: 1px solid #334155; border-radius: 0.75rem; min-height: 140px; text-align: center; transition: transform 0.2s ease-in-out;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
                <div style="color: #60a5fa; margin-bottom: 0.75rem;">
                    {{ partial "icon.html" (dict "name" (.Params.icon | default "wrench") "class" "w-8 h-8") }}
                </div>
                <h3 style="font-size: 1rem; font-weight: 700; color: #f1f5f9; margin: 0;">{{ .Title }}</h3>
            </article>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
