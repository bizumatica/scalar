<header class="site-header border-b border-slate-800/50 py-6 bg-slate-950/20 backdrop-blur-sm">
    <div class="container mx-auto px-4 flex justify-between items-center">
        <div>
            <a href="{{ .Site.Home.RelPermalink }}" class="logo font-mono font-bold tracking-tighter text-2xl text-white hover:text-blue-400 transition-colors">
                SCALAR
            </a>
            <nav class="mt-1">
                <small class="text-slate-500 uppercase tracking-widest text-[9px] block font-medium">
                    {{ i18n "header_subtitle" }}
                </small>
            </nav>
        </div>

        {{ if .IsTranslated }}
        <nav class="flex gap-2 items-center">
            {{ range .AllTranslations }}
            <a href="{{ .Permalink }}" 
               class="lang-btn {{ if eq .Language.Lang $.Language.Lang }}active{{ end }}"
               title="{{ .Language.LanguageName }}">
                
                {{ if eq .Language.Lang "pt-br" }}
                <svg class="flag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
                    <g fill-rule="evenodd" stroke-width="1pt"><path fill="#009b3a" d="M0 0h640v480H0z"/><path fill="#fedf00" d="M320 40L40 240l280 200 280-200Z"/><circle cx="320" cy="240" r="105" fill="#002776"/><path fill="#fff" d="M225 245c0-40 40-75 95-75 25 0 55 10 75 25-5-30-40-55-85-55-55 0-100 35-100 75v30Z"/></g>
                </svg>
                <span>PT</span>
                {{ else }}
                <svg class="flag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
                    <path fill="#012169" d="M0 0h640v480H0z"/><path fill="#fff" d="m75 0 245 180L565 0h75v55L400 240l240 185v55h-75L320 300 75 480H0v-55l240-185L0 55V0h75z"/><path fill="#C8102E" d="m425 300 215 180h-40L385 300h40zm-210 0L0 480h40l175-180h-40zM0 0l215 180h-40L0 55V0zm425 0 215 180V125L465 0h-40z"/><path fill="#fff" d="M240 0v480h160V0H240zM0 160v160h640V160H0z"/><path fill="#C8102E" d="M280 0v480h80V0h-80zM0 200v80h640v-80H0z"/>
                </svg>
                <span>EN</span>
                {{ end }}
            </a>
            {{ end }}
        </nav>
        {{ end }}
    </div>
</header>
