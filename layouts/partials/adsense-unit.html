{{ $adsenseId := site.Params.adsense_id }}
{{ $slot := .slot }}

<div class="ad-container" style="margin: 0.5rem 0; width: 100%; display: flex; justify-content: center; align-items: center;">
    <ins class="adsbygoogle"
         style="display:block; min-width:250px; max-width:100%; height:140px"
         data-ad-client="{{ $adsenseId }}"
         data-ad-slot="{{ $slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
