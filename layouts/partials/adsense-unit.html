{{ $adsenseId := site.Params.adsense_id }}
{{ $slot := .slot }}

<div class="ad-container" style="margin: 2rem 0; min-height: 280px; display: flex; justify-content: center; align-items: center;">
    {{ if or (hugo.IsServer) (not $adsenseId) }}
        <div style="width: 100%; max-width: 728px; height: 280px; background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 10px, #f1f5f9 10px, #f1f5f9 20px); border: 2px dashed #94a3b8; color: #64748b; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: monospace; border-radius: 8px;">
            <strong style="font-size: 1rem; color: #475569;">[ADSENSE PLACEHOLDER]</strong>
            <span style="font-size: 0.8rem;">Slot: {{ $slot | default "Não definido" }}</span>
            <span style="font-size: 0.8rem;">ID: {{ $adsenseId | default "Aguardando config" }}</span>
        </div>
    {{ else }}
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ $adsenseId }}" crossorigin="anonymous"></script>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="{{ $adsenseId }}"
             data-ad-slot="{{ $slot }}"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    {{ end }}
</div>
