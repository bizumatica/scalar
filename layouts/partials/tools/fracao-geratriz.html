{{ $slug := "fracao-geratriz" }}

<div id="fracao-geratriz-container" 
     data-lang="{{ lower site.Language.Lang }}" 
     data-msg-error="{{ i18n (printf "solvers.%s.err_invalid_decimal" $slug) }}"
     data-txt-exact="{{ i18n (printf "solvers.%s.type_exact" $slug) }}"
     data-txt-simple="{{ i18n (printf "solvers.%s.type_simple" $slug) }}"
     data-txt-compound="{{ i18n (printf "solvers.%s.type_compound" $slug) }}"
     data-txt-integer="{{ i18n (printf "solvers.%s.type_integer" $slug) }}"
     data-txt-step-class="{{ i18n (printf "solvers.%s.step_classification" $slug) }}"
     data-txt-step-base="{{ i18n (printf "solvers.%s.step_base_assembly" $slug) }}"
     data-txt-step-simp="{{ i18n (printf "solvers.%s.step_simplification" $slug) }}"
     data-txt-gcd="{{ i18n (printf "solvers.%s.label_gcd" $slug) }}"
     data-txt-step-final="{{ i18n (printf "solvers.%s.step_final_result" $slug) }}"
     class="flex flex-col gap-6 p-6 rounded-xl border border-slate-800 bg-slate-900/40 text-white w-full box-border">
  
  <p class="m-0 text-sm text-slate-400 leading-relaxed font-mono">
    {{ i18n (printf "solvers.%s.instruction" $slug) }}
  </p>

  <!-- Input e Ação -->
  <div class="flex flex-col gap-2">
    <label for="input-decimal" class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-2">
      <i data-lucide="calculator" class="w-4 h-4"></i>
      <span>{{ i18n (printf "solvers.%s.label_decimal_value" $slug) }}</span>
    </label>
    
    <div class="flex flex-col sm:flex-row gap-3">
      <input type="text" id="input-decimal" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="0.1666... ou 0.1(6)"
             class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white font-mono text-base focus:outline-none focus:border-indigo-500 transition-colors">
      
      <button id="btn-resolver" type="button" 
              class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-lg text-sm transition-colors cursor-pointer flex items-center justify-center gap-2 shrink-0">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span>{{ i18n (printf "solvers.%s.btn_calculate_fraction" $slug) }}</span>
      </button>

      <button id="btn-limpar" type="button" 
              class="bg-slate-950 hover:bg-slate-800 text-slate-400 border border-slate-800 font-semibold px-4 py-3 rounded-lg text-sm transition-colors cursor-pointer flex items-center justify-center gap-2 shrink-0">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        <span class="font-mono">{{ i18n (printf "solvers.%s.btn_clear" $slug) }}</span>
      </button>
    </div>
  </div>

  <!-- Display de Resultados -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-2">
    
    <!-- Renderização da Fração Resultante -->
    <div class="lg:col-span-1 bg-slate-950/60 border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center text-center">
      <span class="text-xs font-bold text-indigo-400 tracking-wider uppercase mb-4">
        {{ i18n (printf "solvers.%s.label_irreducible_fraction" $slug) }}
      </span>
      
      <div id="fracao-render-container" class="min-h-[100px] flex items-center justify-center">
        <span class="text-slate-600 text-2xl font-mono">—</span>
      </div>
    </div>

    <!-- Painel de Lógica Passo a Passo -->
    <div class="lg:col-span-2 bg-slate-950/40 border border-slate-800/80 rounded-xl p-6 flex flex-col gap-3">
      <span class="text-xs font-bold text-emerald-400 tracking-wider uppercase flex items-center gap-2">
        <i data-lucide="binary" class="w-4 h-4"></i>
        <span>{{ i18n (printf "solvers.%s.label_step_by_step_logic" $slug) }}</span>
      </span>
      
      <div id="logica-detalhe" class="text-sm font-mono text-slate-300 leading-relaxed break-words whitespace-pre-line">
        {{ i18n (printf "solvers.%s.msg_waiting_input_math" $slug) }}
      </div>
    </div>

  </div>

</div>
