<div class="tool-card" style="background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; padding: 1.5rem; border-radius: 1rem;">
    <div class="input-group">
        <label for="input-decimal" class="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-2 block">
            Insira o decimal (Ex: 0.75 ou 0.333...)
        </label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="input-decimal" placeholder="0.333" 
                   style="flex: 2; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.75rem; border-radius: 0.5rem; font-family: monospace; outline: none;">
            
            <button id="btn-resolver" 
                    style="flex: 1; background: #3b82f6; color: #fff; font-weight: bold; border: none; border-radius: 0.5rem; cursor: pointer; transition: opacity 0.2s;"
                    onmouseover="this.style.opacity='0.9'" 
                    onmouseout="this.style.opacity='1'">
                Calcular
            </button>
        </div>
    </div>

    <div class="comparison-grid" style="display: grid; grid-template-columns: 1fr; md:grid-template-columns: 1fr 1fr; gap: 1.5rem; mt-8;">
        {{/* Resultado Principal */}}
        <div id="resultado-fracao" style="background: rgba(30, 41, 59, 0.3); border: 1px solid #1e293b; padding: 1.5rem; border-radius: 0.75rem; text-align: center;">
            <span class="text-xs text-blue-400 font-bold uppercase block mb-2">Fração Irredutível</span>
            <div id="fracao-final" style="font-size: 2.5rem; font-family: 'Courier New', monospace; color: #fff; font-weight: 800;">—</div>
        </div>

        {{/* Lógica Passo a Passo */}}
        <div id="passo-a-passo" style="background: rgba(15, 23, 42, 0.3); border: 1px solid #1e293b; padding: 1.5rem; border-radius: 0.75rem;">
            <span class="text-xs text-emerald-400 font-bold uppercase block mb-2">Lógica Aplicada</span>
            <div id="logica-detalhe" style="font-size: 0.9rem; color: #94a3b8; font-family: monospace; line-height: 1.6;">
                Aguardando entrada...
            </div>
        </div>
    </div>
</div>
