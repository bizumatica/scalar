<div class="tool-card">
    <div class="comparison-grid">
        {{/* Decimal */}}
        <div class="input-group">
            <label><i data-lucide="hash"></i> {{ i18n "base_decimal" }} (Base 10)</label>
            <input type="number" id="base-dec" placeholder="{{ i18n "placeholder_dec" }}" 
                   style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.75rem; border-radius: 0.5rem; font-family: monospace; outline: none;">
        </div>

        {{/* Binário */}}
        <div class="input-group">
            <label><i data-lucide="binary"></i> {{ i18n "base_binary" }} (Base 2)</label>
            <input type="text" id="base-bin" placeholder="{{ i18n "placeholder_bin" }}" 
                   style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.75rem; border-radius: 0.5rem; font-family: monospace; outline: none;">
        </div>

        {{/* Hexadecimal */}}
        <div class="input-group">
            <label><i data-lucide="terminal"></i> {{ i18n "base_hex" }} (Base 16)</label>
            <input type="text" id="base-hex" placeholder="{{ i18n "placeholder_hex" }}" 
                   style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.75rem; border-radius: 0.5rem; font-family: monospace; outline: none;">
        </div>

        {{/* Octal */}}
        <div class="input-group">
            <label><i data-lucide="cpu"></i> {{ i18n "base_octal" }} (Base 8)</label>
            <input type="text" id="base-oct" placeholder="{{ i18n "placeholder_oct" }}" 
                   style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.75rem; border-radius: 0.5rem; font-family: monospace; outline: none;">
        </div>
    </div>
</div>
