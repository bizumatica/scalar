<div class="tool-card">
    <div class="comparison-grid">
        <div class="input-group">
            <label><i data-lucide="hash"></i> Decimal (Base 10)</label>
            <input type="number" id="base-dec" placeholder="Ex: 255">
        </div>
        <div class="input-group">
            <label><i data-lucide="binary"></i> Binário (Base 2)</label>
            <input type="text" id="base-bin" placeholder="Ex: 11111111">
        </div>
        <div class="input-group">
            <label><i data-lucide="terminal"></i> Hexadecimal (Base 16)</label>
            <input type="text" id="base-hex" placeholder="Ex: FF">
        </div>
        <div class="input-group">
            <label><i data-lucide="cpu"></i> Octal (Base 8)</label>
            <input type="text" id="base-oct" placeholder="Ex: 377">
        </div>
    </div>
</div>
