{{ $lang := lower site.Language.Lang }}

<div id="mdc-mmc-container" data-lang="{{ $lang }}"
     data-msg-error="{{ i18n "err_mdc_mmc_invalid" | default "Insira apenas números inteiros maiores que zero." }}"
     class="flex flex-col gap-6 p-6 rounded-xl border border-slate-800 bg-slate-900/40 text-white w-full box-border">

  <!-- Grid de Entradas de Dados -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
    
    <!-- Campo Número A -->
    <div class="flex flex-col gap-2">
      <label for="inputA" class="text-xs font-mono text-slate-400 uppercase tracking-wider font-bold">
        {{ i18n "label_number_a" | default "Número A" }}
      </label>
      <input type="text" id="inputA" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="{{ i18n "ph_number_a" | default "Ex: 24" }}"
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white font-mono text-base focus:outline-none focus:border-indigo-500 transition-colors">
    </div>

    <!-- Campo Número B -->
    <div class="flex flex-col gap-2">
      <label for="inputB" class="text-xs font-mono text-slate-400 uppercase tracking-wider font-bold">
        {{ i18n "label_number_b" | default "Número B" }}
      </label>
      <input type="text" id="inputB" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="{{ i18n "ph_number_b" | default "Ex: 36" }}"
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white font-mono text-base focus:outline-none focus:border-indigo-500 transition-colors">
    </div>

  </div>

  <!-- Botão de Ação -->
  <button id="btn-calcular-mdc-mmc" type="button"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-6 rounded-lg text-sm transition-colors cursor-pointer flex items-center justify-center gap-2">
    <i data-lucide="calculator" class="w-4 h-4"></i>
    <span>{{ i18n "btn_calculate_mdc_mmc" | default "Calcular MDC & MMC" }}</span>
  </button>

  <!-- Grid de Resultados -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mt-2">
    
    <!-- Painel MDC -->
    <div class="bg-slate-950/60 border border-slate-800/80 p-6 rounded-xl text-center flex flex-col items-center justify-center">
      <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2">
        {{ i18n "label_mdc_title" | default "MDC (Máximo Divisor Comum)" }}
      </span>
      <div id="resultMDC" class="text-3xl font-mono font-extrabold text-white">--</div>
    </div>

    <!-- Painel MMC -->
    <div class="bg-slate-950/60 border border-slate-800/80 p-6 rounded-xl text-center flex flex-col items-center justify-center">
      <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">
        {{ i18n "label_mmc_title" | default "MMC (Mínimo Múltiplo Comum)" }}
      </span>
      <div id="resultMMC" class="text-3xl font-mono font-extrabold text-white">--</div>
    </div>

  </div>

</div>
