{{/* Componente Único de Resultado para todas as ferramentas */}}
<div class="result-container" style="
    margin: 2rem 0;
    padding: 1.5rem;
    background: rgba(15, 23, 42, 0.6);
    border: 2px solid #2563eb;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100px;
    text-align: center;
">
    <span style="
        color: #60a5fa;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
    ">
        {{ .label | default "Resultado" }}
    </span>
    
    <div id="{{ .id | default "result" }}" style="
        color: #ffffff;
        font-size: 2.5rem;
        font-weight: 700;
        font-family: 'JetBrains Mono', monospace; /* Fonte técnica */
        line-height: 1;
    ">
        0
    </div>
</div>
