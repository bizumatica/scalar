{{ $adsenseId := site.Params.adsense_id }}

{{ if and (not hugo.IsServer) $adsenseId }}
<div class="ads-container" style="margin: 2rem 0; display: flex; justify-content: center; align-items: center; min-height: 100px;">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ $adsenseId }}" crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ $adsenseId }}"
         data-ad-slot="{{ .slot | default "XXXXXXXXXX" }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
{{ else }}
<div style="margin: 2rem 0; padding: 2rem; border: 2px dashed #334155; border-radius: 12px; text-align: center; background-color: rgba(30, 41, 59, 0.05);">
    <span style="font-size: 0.75rem; font-family: monospace; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em;">
        {{ if not $adsenseId }}Configurar adsense_id no hugo.toml{{ else }}Espaço AdSense (Produção){{ end }}
    </span>
</div>
{{ end }}
