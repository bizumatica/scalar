{{ if not hugo.IsServer }}
<div class="ads-container" style="margin: 2rem 0; display: flex; justify-content: center; align-items: center; min-height: 100px;">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX" crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
{{ else }}
{{/* Placeholder com estilo forçado para Visualização em Dev */}}

        Espaço AdSense (Ativo apenas em Produção)
    </span>
