name: 🚀 Scalar CI/CD

on:
  push:
    branches: [ main ]

# Define variáveis de ambiente globais para unificar o comportamento do Hugo
env:
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Hugo Environment
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.1'  # Atualizado para a versão exata que você usa localmente
          extended: true

      - name: 💾 Active Hugo Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/hugo.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: ⚡ Build with Precision
        run: hugo --gc --minify

      - name: ☁️ Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=scalar3